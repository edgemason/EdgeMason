[project]
name = "edgemason"
version = "0.1.0"
description = "Edge AI model optimization toolkit"
requires-python = ">=3.9,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.7.0",
    "python-multipart==0.0.9",
    "onnx==1.16.0",
    "onnxruntime==1.18.0",
    "numpy==1.26.4",
    "psutil==6.0.0",
    "tf2onnx==1.16.0",
    "tensorflow==2.15.1",
    "keras==2.15.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
